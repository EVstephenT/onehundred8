<style>
:root {
  --bg: #0d1613; --panel: #14211c; --panel-2: #1b2b25; --line: #2a3d35;
  --fg: #efe9d8; --muted: #9db0a5; --accent: #93d64f; --teal: #67cbab;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--fg); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(110% 70% at 50% -10%, #1d3a2c 0%, var(--bg) 60%) fixed, var(--bg);
  display: flex; flex-direction: column; align-items: center;
}
main { width: 100%; max-width: 560px; padding: 56px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 28px; flex: 1; }
h1 { margin: 0; font-weight: 600; font-size: clamp(34px, 9vw, 52px); letter-spacing: -0.03em; line-height: 1; }
h1 .tld { color: var(--muted); font-weight: 500; }
.art { width: min(360px, 82vw); aspect-ratio: 1; border-radius: 28px; display: block; box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(0,0,0,.45); }
.links { width: 100%; display: grid; gap: 12px; }
.card {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s, transform .15s;
}
.card:hover, .card:focus-visible { border-color: var(--teal); background: var(--panel-2); transform: translateY(-1px); outline: none; }
.card img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
.card .t { font-weight: 600; font-size: 17px; }
.card .d { color: var(--muted); font-size: 14px; margin-top: 2px; }
.card .go { margin-left: auto; color: var(--muted); font-size: 20px; }
.card:hover .go { color: var(--teal); }
footer { padding: 8px 16px 28px; }
.byline { color: var(--accent); text-decoration: none; font-size: 14px; letter-spacing: .02em; }
.byline:hover { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 460px) { main { padding-top: 40px; gap: 24px; } }
</style>

    </a>
  </nav>
